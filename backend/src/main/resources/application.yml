server:
  port: 8080

spring:
  application:
    name: embos-backend
  datasource:
    url: jdbc:mysql://localhost:3306/embos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC&characterEncoding=UTF-8
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

embos:
  jwt:
    secret: "EMBOS_SUPER_SECRET_KEY_CHANGE_ME_0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
    expiration-ms: 86400000
  cors:
    allowed-origins: "http://localhost:3000"
  app:
    base-url: "${EMBOS_APP_BASE_URL:http://localhost:3000}"
  mail:
    brevo-api-key: "${BREVO_API_KEY:}"
    from: "${EMBOS_MAIL_FROM:EMBOS <swam01708@gmail.com>}"
